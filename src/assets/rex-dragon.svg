<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8845a"/>
      <stop offset="100%" stop-color="#b8442a"/>
    </radialGradient>
    <radialGradient id="wingGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0a060"/>
      <stop offset="100%" stop-color="#c05030"/>
    </radialGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d090"/>
      <stop offset="100%" stop-color="#e0a050"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e" rx="8"/>
  <circle cx="350" cy="40" r="20" fill="#f0e68c" opacity="0.3"/>
  <circle cx="350" cy="40" r="12" fill="#f0e68c" opacity="0.5"/>

  <!-- Far wing -->
  <path d="M180 110 Q220 40 300 50 Q280 80 300 110 Q260 90 240 120 Z" fill="#a04020" opacity="0.6" stroke="#8a3018" stroke-width="1.5"/>
  <path d="M210 75 Q250 55 280 70" fill="none" stroke="#8a3018" stroke-width="1" opacity="0.5"/>
  <path d="M220 95 Q255 80 275 95" fill="none" stroke="#8a3018" stroke-width="1" opacity="0.5"/>

  <!-- Tail -->
  <path d="M80 190 Q40 200 20 180 Q5 165 15 145 Q20 135 30 140" fill="none" stroke="#c05030" stroke-width="8" stroke-linecap="round"/>
  <!-- Tail spike -->
  <path d="M15 145 L5 130 L20 138 Z" fill="#d66b42" stroke="#8a3018" stroke-width="1"/>
  <!-- Tail barbs -->
  <path d="M25 170 L10 160 M30 155 L18 148" stroke="#d66b42" stroke-width="2" fill="none"/>

  <!-- Body -->
  <ellipse cx="160" cy="160" rx="85" ry="55" fill="url(#bodyGrad)" stroke="#8a3018" stroke-width="2" transform="rotate(-10 160 160)"/>

  <!-- Belly -->
  <ellipse cx="155" cy="180" rx="55" ry="32" fill="url(#bellyGrad)" stroke="#b87030" stroke-width="1" transform="rotate(-10 155 180)"/>
  <!-- Belly scales -->
  <path d="M120 170 Q130 165 140 170 M135 180 Q145 175 155 180 M150 190 Q160 185 170 190 M140 160 Q150 155 160 160" stroke="#c08040" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Near wing -->
  <path d="M170 120 Q210 30 320 35 Q295 70 320 105 Q275 80 250 115 Q230 100 170 120 Z" fill="url(#wingGrad)" stroke="#8a3018" stroke-width="2"/>
  <!-- Wing membrane details -->
  <path d="M185 105 Q230 60 290 55" fill="none" stroke="#a04020" stroke-width="1.5"/>
  <path d="M195 112 Q245 75 305 80" fill="none" stroke="#a04020" stroke-width="1.5"/>
  <path d="M200 118 Q240 90 295 100" fill="none" stroke="#a04020" stroke-width="1.5"/>
  <!-- Wing ribs -->
  <path d="M170 120 Q200 70 210 55" fill="none" stroke="#c06030" stroke-width="2"/>
  <path d="M170 120 Q230 75 245 65" fill="none" stroke="#c06030" stroke-width="2"/>
  <path d="M170 120 Q260 85 270 80" fill="none" stroke="#c06030" stroke-width="2"/>

  <!-- Neck -->
  <path d="M220 140 Q250 115 260 95" fill="none" stroke="#c05030" stroke-width="22" stroke-linecap="round"/>
  <path d="M215 145 Q245 120 255 100" fill="none" stroke="url(#bellyGrad)" stroke-width="14" stroke-linecap="round" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="270" cy="85" rx="30" ry="22" fill="#d06038" stroke="#8a3018" stroke-width="2" transform="rotate(15 270 85)"/>

  <!-- Snout -->
  <path d="M290 78 Q320 72 330 82 Q335 90 325 95 Q310 98 295 95" fill="#c05030" stroke="#8a3018" stroke-width="2"/>
  <!-- Nostril -->
  <ellipse cx="322" cy="82" rx="3" ry="2.5" fill="#4a1a0a"/>
  <!-- Smoke from nostril -->
  <path d="M325 78 Q332 72 328 65 Q335 60 330 52" fill="none" stroke="#888" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Jaw -->
  <path d="M290 92 Q310 100 325 96" fill="none" stroke="#8a3018" stroke-width="2"/>
  <!-- Teeth -->
  <path d="M295 94 L298 100 L302 94 M308 95 L310 101 L314 95 M318 94 L320 99 L323 93" fill="#fff" stroke="#ddd" stroke-width="0.5"/>

  <!-- Eye -->
  <ellipse cx="278" cy="78" rx="7" ry="6" fill="#2a0a00"/>
  <ellipse cx="278" cy="78" rx="5.5" ry="5" fill="url(#eyeGrad)"/>
  <ellipse cx="278" cy="78" rx="2.5" ry="4" fill="#111"/>
  <circle cx="280" cy="76" r="1.5" fill="#fff" opacity="0.8"/>

  <!-- Brow ridge -->
  <path d="M265 72 Q275 66 290 70" fill="none" stroke="#a04020" stroke-width="2.5"/>

  <!-- Head horn -->
  <path d="M258 70 Q250 45 265 30" fill="none" stroke="#8a6040" stroke-width="4" stroke-linecap="round"/>
  <path d="M265 32 Q268 28 263 25" fill="none" stroke="#8a6040" stroke-width="3" stroke-linecap="round"/>

  <!-- Head spines -->
  <path d="M260 85 L248 78 M255 95 L242 92 M265 100 L255 102" stroke="#b05030" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Front leg -->
  <path d="M130 185 Q120 210 115 230 Q112 242 118 248" fill="none" stroke="#c05030" stroke-width="10" stroke-linecap="round"/>
  <!-- Claws -->
  <path d="M115 248 L108 252 M118 248 L113 254 M121 248 L119 255" stroke="#ddd" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Back leg -->
  <path d="M190 185 Q200 215 195 240 Q192 250 198 255" fill="none" stroke="#c05030" stroke-width="11" stroke-linecap="round"/>
  <!-- Claws -->
  <path d="M195 255 L188 259 M198 255 L193 261 M201 255 L199 262" stroke="#ddd" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Back spines -->
  <path d="M100 140 L88 128 L96 145 M115 125 L105 110 L112 128 M135 115 L128 98 L140 115 M155 110 L150 92 L160 108" fill="#e08050" stroke="#a04020" stroke-width="1"/>

  <!-- Belly fire glow -->
  <ellipse cx="270" cy="95" rx="8" ry="4" fill="#ff6600" opacity="0.2" filter="url(#glow)"/>

  <!-- Floating embers -->
  <circle cx="340" cy="70" r="1.5" fill="#ffaa00" opacity="0.6"/>
  <circle cx="348" cy="60" r="1" fill="#ffcc00" opacity="0.4"/>
  <circle cx="335" cy="55" r="1.2" fill="#ff8800" opacity="0.5"/>
</svg>
